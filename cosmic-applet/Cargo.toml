[package]
name = "cosmic-applet-claude-usage"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "COSMIC panel applet showing Claude Code and Codex usage"
homepage = "https://codezeno.com.au"
repository = "https://github.com/CodeZeno/Claude-Code-Usage-Monitor"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["wayland", "tokio", "winit", "multi-window"]
